name: Images

# Builds the API and dashboard images on every PR so a broken Dockerfile is caught before merge.
# On main, pushes them to GHCR tagged with the commit sha and "main".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: dashboard
            dockerfile: Dockerfile.dashboard
    steps:
    - uses: actions/checkout@v5

    - uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image name
      id: image
      run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

    # Dockerfile.dashboard stops on an empty VITE_API_URL. With no repository variable, the image calls localhost.
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: ${{ github.event_name != 'pull_request' }}
        build-args: |
          COMMIT_HASH=${{ github.sha }}
          VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}
          VITE_SITE_URL=${{ vars.VITE_SITE_URL }}
        tags: |
          ${{ steps.image.outputs.ref }}:${{ github.sha }}
          ${{ steps.image.outputs.ref }}:main
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.name }}
