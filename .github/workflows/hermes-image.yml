name: Hermes image

# Builds deploy/hermes when it changes. On main, pushes it to GHCR tagged with the commit sha and "main".

on:
  push:
    branches: [main]
    paths: [deploy/hermes/**, .github/workflows/hermes-image.yml]
  pull_request:
    paths: [deploy/hermes/**, .github/workflows/hermes-image.yml]
  workflow_dispatch:

concurrency:
  group: hermes-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v5

    - uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image name
      id: image
      run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}-hermes" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: deploy/hermes
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ steps.image.outputs.ref }}:${{ github.sha }}
          ${{ steps.image.outputs.ref }}:main
