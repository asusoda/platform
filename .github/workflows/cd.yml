name: CD

# Deploys SoDA's production server. Runs only in asusoda/platform, never in forks,
# and only after the Check workflow has passed on the same commit of main.

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    if: github.repository == 'asusoda/platform' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        port: ${{ secrets.VPS_SSH_PORT }}
        # A deploy key (VPS_SSH_KEY) is used when set; the password stays as a fallback until it is.
        key: ${{ secrets.VPS_SSH_KEY }}
        password: ${{ secrets.VPS_SSH_PASSWORD }}
        script: |
          set -e

          PROJECT_DIR="${PROJECT_DIR:-/var/www/soda-internal-api}"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "Error: Project directory $PROJECT_DIR not found"
            exit 1
          fi
          cd "$PROJECT_DIR"

          echo "Discarding local changes..."
          make discard-local-changes

          echo "Backing up the database..."
          make backup

          echo "Starting deployment..."
          if ! make deploy; then
            echo "Deployment failed, rolling back..."
            make logs || true
            make rollback || true
            exit 1
          fi

          echo "Verifying deployment health..."
          if ! make health; then
            echo "Health check failed, rolling back..."
            make status || true
            make rollback || true
            exit 1
          fi

          echo "Deployment completed successfully."
