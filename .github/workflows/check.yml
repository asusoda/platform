name: Check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --frozen

    # Lint, format check, type check, tests (including the API contract tests) and migrations.
    # Nothing is fixed or committed here: a failure blocks the merge.
    - name: Run all checks
      run: make ci

    - name: Run bandit security checks
      run: uv run bandit -c pyproject.toml -r . -f txt

  # The same tests and migrations against Postgres, the production database from phase 2 on.
  postgres:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector for the knowledge module
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://postgres:postgres@localhost:5432/platform_test
    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run migrations and check them against the models
      run: DATABASE_URL=$PG_URL uv run alembic upgrade head && DATABASE_URL=$PG_URL uv run alembic check

    - name: Run tests
      run: TEST_DATABASE_URL=$PG_URL uv run pytest tests -q

  # Type check, unit tests and build of the officer dashboard.
  dashboard:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: dashboard/package-lock.json

    - run: npm ci
    - run: npm test
    - run: npm run build
