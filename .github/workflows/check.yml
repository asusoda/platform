name: Check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --frozen

    # Lint, format check, type check, tests (including the API contract tests) and migrations.
    # Nothing is fixed or committed here: a failure blocks the merge.
    - name: Run all checks
      run: make ci

    - name: Run bandit security checks
      run: uv run bandit -c pyproject.toml -r . -f txt
