# SearXNG for the web live query and agent web search; unset values keep upstream defaults.
use_default_settings: true

general:
  instance_name: platform-search

server:
  # SearXNG refuses this value; SEARXNG_SECRET replaces it
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  formats:
    - html
    - json
