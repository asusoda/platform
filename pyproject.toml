[project]
name = "soda-platform"
version = "0.1.0"
description = "SoDA Platform"
authors = [{name = "SoDA", email = "asu@thesoda.io"}]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "aiosignal==1.4.0",
    "asgiref==3.11.1",
    "async-timeout==5.0.1",
    "attrs==25.4.0",
    "blinker==1.9.0",
    "cachetools==7.0.0",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "click==8.3.1",
    "colorama==0.4.6",
    "dnspython==2.8.0",
    "flask==3.1.2",
    "flask-cors==6.0.2",
    "frozenlist==1.8.0",
    "greenlet==3.3.1",
    "h11==0.16.0",
    "idna>=3.11",
    "importlib-metadata==8.7.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "multidict>=6.3.2",
    "nest-asyncio==1.6.0",
    "oauthlib==3.3.1",
    "py-cord>=2.6.1",
    "pyjwt>=2.9.0",
    "psycopg2-binary>=2.9.10",
    "requests==2.32.5",
    "requests-oauthlib==2.0.0",
    "sqlalchemy==2.0.46",
    "typing-extensions>=4.13.1",
    "urllib3==2.6.3",
    "werkzeug==3.1.5",
    "yarl>=1.18.3",
    "zipp==3.23.0",
    "python-dotenv>=1.1.0",
    "google-auth>=2.38.0",
    "google-api-python-client>=2.166.0",
    "cryptography>=44.0.2",
    "gunicorn==25.0.1",
    "notion-client>=2.3.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-core>=2.11.0",
    "sentry-sdk[flask]>=2.35.0",
    "pytz>=2025.2",
    "python-dateutil>=2.9.0.post0",
    "tzdata>=2025.2",
    "colorlog>=6.9.0",
    "clerk-backend-api>=4.2.0",
    "alembic>=1.18.4",
    "procrastinate==3.9.0",
    "croniter>=6.0",
    "mcp==2.2.0",
    "jsonschema>=4.20",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "defusedxml>=0.7.1",
    "pyyaml>=6.0.3",
    "paramiko>=3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--verbose"

[tool.hatch.build.targets.wheel]
packages = ["modules"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.8.7",
    "ty>=0.0.14",
    "bandit>=1.7.0",
    "pre-commit>=4.0.0",
    "import-linter>=2.15",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests", "web", "node_modules", ".venv"]

# Module boundaries, checked in CI by `lint-imports` (docs/roadmap.md, "Codebase layout").
[tool.importlinter]
root_packages = ["core", "modules"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core imports no module"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["modules"]
# Existing exceptions, to be moved into core or behind a service function:
ignore_imports = [
    "core.db -> modules.storefront.models",
    "core.TokenManager -> modules.auth.models",
    "core.discord_directory -> modules.organizations.models",
]

[[tool.importlinter.contracts]]
name = "service modules do not import Flask"
type = "forbidden"
source_modules = [
    "modules.accounts.providers",
    "modules.accounts.service",
    "modules.agents.service",
    "modules.agents.turns",
    "modules.asu.service",
    "modules.auth.machine_tokens",
    "modules.calendar.service",
    "modules.compute.cli_login",
    "modules.compute.files",
    "modules.compute.schedule",
    "modules.compute.service",
    "modules.compute.ssh",
    "modules.knowledge.crawl",
    "modules.knowledge.embedder",
    "modules.knowledge.extract",
    "modules.knowledge.fetch",
    "modules.knowledge.service",
    "modules.leetcode.daily",
    "modules.leetcode.service",
    "modules.mcp.runtime",
    "modules.organizations.service",
    "modules.points.service",
    "modules.runpod.service",
]
forbidden_modules = ["flask"]
