# Hermes Agent on a CPU pod. The template block is for the template catalog and is removed on create.
template:
  title: Hermes Agent
  summary: Discord agent from Nous Research. Uses Platform tools over MCP.
  inputs:
    - {kind: image, label: Image}
    - {kind: env, key: PLATFORM_MCP_URL, label: Platform MCP URL}
    - {kind: secret, key: PLATFORM_TOKEN, label: Platform machine token}
    - {kind: secret, key: DISCORD_BOT_TOKEN, label: Discord bot token}
    - {kind: env, key: DISCORD_ALLOWED_ROLES, label: Discord role IDs}
    - {kind: secret, key: OPENROUTER_API_KEY, label: OpenRouter API key}
    - {kind: secret, key: API_SERVER_KEY, label: Hermes API key}
    - {kind: volume, label: Network volume ID}
    - {kind: data_center, label: Data center of the volume}
kind: agent
description: Hermes Agent, a Discord agent with Platform tools
cpu: {id: cpu3c, vcpuCount: 2}
cloud: SECURE
disk: 20
ports: ["8642/http"]
mounts:
  network:
    - {path: /opt/data}
env:
  HERMES_PROVIDER: openrouter
  HERMES_MODEL: anthropic/claude-sonnet-4.5
  API_SERVER_ENABLED: "true"
  API_SERVER_HOST: 0.0.0.0
health: {port: 8642, path: /health}
